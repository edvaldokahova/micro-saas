<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Bilonai · Sem ligação</title>
<link rel="icon" href="/favicon.png" />
<!-- Página guardada no aparelho pelo service worker (public/sw.js) e mostrada quando não há internet.
     Tudo dentro do ficheiro: estilos, logótipo e textos nas três línguas. -->
<style>
  :root { --bg:#f7f7f8; --surface:#fff; --line:#e2e3e7; --text:#121316; --muted:#60636b; --btn:#121316; --on-btn:#fff; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#101114; --surface:#17181c; --line:#2a2b31; --text:#f1f1f3; --muted:#969aa3; --btn:#f1f1f3; --on-btn:#101114; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg:#101114; --surface:#17181c; --line:#2a2b31; --text:#f1f1f3; --muted:#969aa3; --btn:#f1f1f3; --on-btn:#101114; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  header { height: 64px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--line); }
  header svg { height: 16px; width: auto; }
  main { flex: 1; display: grid; place-items: center; padding: 32px 20px 64px; }
  .box { max-width: 420px; text-align: center; }
  .eye { width: 76px; height: 76px; margin: 0 auto 28px; display: block; }
  h1 { margin: 0; font-size: 30px; line-height: 1.08; font-weight: 600; letter-spacing: -0.025em; font-stretch: 84%; }
  p { margin: 12px 0 0; color: var(--muted); font-size: 16px; }
  button { margin-top: 28px; min-height: 46px; padding: 0 26px; border-radius: 999px; border: 0; background: var(--btn); color: var(--on-btn); font: inherit; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  button:active { transform: scale(.98); }
  button:focus-visible { outline: 1.5px solid var(--text); outline-offset: 3px; }
  .status { margin-top: 18px; font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
  .status i { width: 7px; height: 7px; border-radius: 50%; background: #c23a2b; display: inline-block; }
</style>
</head>
<body>
<header>
  <svg viewBox="56 26 488 92" fill="none" role="img" aria-label="Bilonai">
    <defs><clipPath id="c"><rect x="0" y="40" width="600" height="64" /></clipPath></defs>
    <path d="M18.64 -22.22A29 29 0 1 1 -5.04 -28.56" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="translate(300 72)" />
    <circle cx="308.48" cy="44.27" r="5.2" fill="currentColor" />
    <g stroke="currentColor" stroke-width="6" stroke-miterlimit="10">
      <path d="M64.5 40V104" /><path d="M64.5 43H91.5A14.5 14.5 0 0 1 91.5 72H64.5" /><path d="M64.5 72H94.5A14.5 14.5 0 0 1 94.5 101H64.5" />
      <path d="M147 40V104" /><path d="M185 40V101H225" />
      <g clip-path="url(#c)"><path d="M378 104V40L424 104V40" /></g>
      <g clip-path="url(#c)"><path d="M454 104L481 40L508 104" /><path d="M461 88H501" stroke-width="4.5" /></g>
      <path d="M535.5 40V104" />
    </g>
  </svg>
</header>
<main>
  <div class="box">
    <svg class="eye" viewBox="-36 -36 72 72" fill="none" aria-hidden="true">
      <g>
        <path d="M18.64 -22.22A29 29 0 1 1 -5.04 -28.56" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
        <circle cx="8.48" cy="-27.73" r="5.2" fill="currentColor" />
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite" />
      </g>
    </svg>
    <h1 id="t"></h1>
    <p id="l"></p>
    <button id="b" type="button"></button>
    <div><span class="status"><i></i><span id="s"></span></span></div>
  </div>
</main>
<script>
  (function () {
    var T = {
      "pt-PT": { t: "Sem ligação à internet", l: "Verifique o Wi-Fi ou os dados móveis. Quando a ligação voltar, a página abre sozinha.", b: "Tentar de novo", s: "Sem rede", title: "Sem ligação" },
      "es-ES": { t: "Sin conexión a internet", l: "Revisa el wifi o los datos móviles. Cuando vuelva la conexión, la página se abrirá sola.", b: "Reintentar", s: "Sin red", title: "Sin conexión" },
      "pt-BR": { t: "Sem conexão com a internet", l: "Verifique o Wi-Fi ou os dados móveis. Quando a conexão voltar, a página abre sozinha.", b: "Tentar de novo", s: "Sem rede", title: "Sem conexão" }
    };
    function cookie(n) { var m = document.cookie.match(new RegExp("(?:^|; )" + n + "=([^;]*)")); return m ? decodeURIComponent(m[1]) : ""; }
    var loc = cookie("be_locale");
    if (!T[loc]) { var n = (navigator.language || "pt-PT").toLowerCase(); loc = n.indexOf("es") === 0 ? "es-ES" : n === "pt-br" ? "pt-BR" : "pt-PT"; }
    var theme = cookie("be_theme");
    if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme);
    var x = T[loc];
    document.documentElement.lang = loc;
    document.title = "Bilonai · " + x.title;
    document.getElementById("t").textContent = x.t;
    document.getElementById("l").textContent = x.l;
    document.getElementById("b").textContent = x.b;
    document.getElementById("s").textContent = x.s;
    function retry() { location.reload(); }
    document.getElementById("b").addEventListener("click", retry);
    window.addEventListener("online", retry);
  })();
</script>
</body>
</html>
